name: kwikchat
description: KwikChat — lightweight, privacy-first social messaging built for Nigerian networks and devices.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.3
  record: ^7.2.0
  just_audio: ^0.9.40
  intl: ^0.19.0
  uuid: ^4.4.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/kwikchat_logo.png

# App icons generated in CI right after `flutter create` (platform folders are
# not committed). Run locally with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/kwikchat_logo.png"
  adaptive_icon_background: "#0F1110"
  adaptive_icon_foreground: "assets/kwikchat_logo.png"
  min_sdk_android: 23
  windows:
    generate: true
    image_path: "assets/kwikchat_logo.png"
    icon_size: 256
