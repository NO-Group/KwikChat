# Per-platform icon configs: a global config makes flutter_launcher_icons look
# for every platform folder, which fails on a job that only scaffolds one.
flutter_launcher_icons:
  android: true
  image_path: "assets/kwikchat_logo.png"
  adaptive_icon_background: "#0F1110"
  adaptive_icon_foreground: "assets/kwikchat_logo.png"
  min_sdk_android: 23
