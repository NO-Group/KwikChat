<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="KwikChat — fast, light, privacy-first messaging and communities. @username first, no phone number needed.">
  <meta name="theme-color" content="#0f1110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KwikChat">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>KwikChat</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0f1110; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               background: #0f1110; transition: opacity .25s ease; z-index: 9999; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading img { width: 96px; height: 96px; border-radius: 22px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.04); opacity: 1 } }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt="KwikChat"></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Paint-early UX: hide the branded splash once Flutter has booted.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.classList.add('done'); setTimeout(function () { el.remove(); }, 300); }
    });
  </script>
</body>
</html>
