name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: flutter create --project-name kwikchat --org ng.kwikchat --platforms=web,android .

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
        continue-on-error: true

      - name: Build web (smoke test)
        run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci-placeholder-key-000000000000000000
