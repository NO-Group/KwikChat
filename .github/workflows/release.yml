name: Build & Release

# Push a tag (v0.1.0, v0.1.1, …) and every platform builds itself and lands on
# the Releases page. Manual runs build without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: web,     artifact: web }
          - { os: ubuntu-latest,  label: android, artifact: apk }
          # Linux: parked for v0.1. record_linux 0.7.2 does not implement
          # RecordPlatform.startStream from record_platform_interface 1.6.0,
          # so the desktop Linux build cannot compile until that plugin lands
          # a compatible release. Windows covers desktop users meanwhile.
          # - { os: ubuntu-latest,  label: linux,   artifact: linux }
          - { os: windows-latest, label: windows, artifact: windows }

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Generate platform scaffolding
        run: flutter create --project-name kwikchat --org ng.kwikchat --platforms=${{ matrix.label }} .

      - name: Install dependencies
        run: flutter pub get

      - name: Apply brand icons
        run: dart run flutter_launcher_icons

      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          DEFINES="--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=APP_VERSION=${{ github.ref_name }}"
          flutter --version 2>&1 | tee build.log
          case "${{ matrix.label }}" in
            web)
              flutter build web --release --base-href=/ $DEFINES 2>&1 | tee -a build.log ;;
            android)
              flutter build apk --release $DEFINES 2>&1 | tee -a build.log || {
                echo "=== verbose retry (diagnostics) ===" | tee -a build.log
                flutter build apk --release --verbose $DEFINES 2>&1 | tail -n 250 | tee -a build.log
                exit 1
              } ;;
            windows)
              flutter build windows --release $DEFINES 2>&1 | tee -a build.log ;;
          esac

      - name: Package
        shell: bash
        run: |
          # Branch names contain "/" — never use them raw in a filename.
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "SAFE_REF=$SAFE_REF" >> "$GITHUB_ENV"
          case "${{ matrix.label }}" in
            web)     (cd build/web && tar -czf "$GITHUB_WORKSPACE/KwikChat-${SAFE_REF}-web.tar.gz" .) ;;
            android) cp build/app/outputs/flutter-apk/app-release.apk "KwikChat-${SAFE_REF}-android.apk" ;;
            windows) (cd build/windows/x64/runner/Release && powershell -Command "Compress-Archive -Path * -DestinationPath \"$GITHUB_WORKSPACE/KwikChat-${SAFE_REF}-windows-x64.zip\"") ;;
          esac

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KwikChat-${{ env.SAFE_REF }}-android.apk
            KwikChat-${{ env.SAFE_REF }}-windows-x64.zip
            KwikChat-${{ env.SAFE_REF }}-web.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
          # tags like v0.1.0-preview.1 publish as pre-releases, not as the real thing
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **KwikChat ${{ github.ref_name }}**

            | Platform | Download |
            |---|---|
            | Android | `KwikChat-${{ env.SAFE_REF }}-android.apk` — sideload, allow "Install unknown apps" |
            | Windows | `KwikChat-${{ env.SAFE_REF }}-windows-x64.zip` — unzip, run `kwikchat.exe` |
            | Web | `KwikChat-${{ env.SAFE_REF }}-web.tar.gz`, or the hosted site |

            iOS needs a macOS build with your signing identity — see docs/SETUP.md.

      - name: Report build failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s build.log ]; then echo "no build.log — failed before the build step"; exit 0; fi
          { echo "Build failure: **${{ matrix.label }}** for \`$GITHUB_SHA\` (run $GITHUB_RUN_ID)"; echo; echo '```'; tail -c 40000 build.log; echo '```'; } > body.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=ci-report" --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues" -F title="CI analyze report" -F body=@body.md -f "labels[]=ci-report" >/dev/null || true
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$existing/comments" -F body=@body.md >/dev/null || true
          fi

  deploy-web:
    name: Deploy web to Cloudflare Pages
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web
        run: |
          flutter create --project-name kwikchat --org ng.kwikchat --platforms=web .
          flutter pub get
          dart run flutter_launcher_icons
          flutter build web --release --base-href=/ \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish to Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kwikchat
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
