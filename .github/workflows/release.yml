name: Build & Release

# Push a tag (v0.1.0, v0.1.1, …) and every platform builds itself and lands on
# the Releases page. Manual runs build without publishing.
on:
  push:
    tags: ['v*']
    branches: ['arena/32dc8220-kwikchat'] # TEMP: validate platform builds
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FLUTTER_VERSION: '3.35.4'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: web,     artifact: web }
          - { os: ubuntu-latest,  label: android, artifact: apk }
          - { os: ubuntu-latest,  label: linux,   artifact: linux }
          - { os: windows-latest, label: windows, artifact: windows }

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: flutter create --project-name kwikchat --org ng.kwikchat --platforms=${{ matrix.label }} .

      - name: Install dependencies
        run: flutter pub get

      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          DEFINES="--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=APP_VERSION=${{ github.ref_name }}"
          case "${{ matrix.label }}" in
            web)     flutter build web --release --base-href=/ $DEFINES ;;
            android) flutter build apk --release $DEFINES ;;
            linux)   flutter build linux --release $DEFINES ;;
            windows) flutter build windows --release $DEFINES ;;
          esac 2>&1 | tee build.log

      - name: Package
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            web)     (cd build/web && tar -czf "$GITHUB_WORKSPACE/KwikChat-${GITHUB_REF_NAME}-web.tar.gz" .) ;;
            android) cp build/app/outputs/flutter-apk/app-release.apk "KwikChat-${GITHUB_REF_NAME}-android.apk" ;;
            linux)   (cd build/linux/x64/release && tar -czf "$GITHUB_WORKSPACE/KwikChat-${GITHUB_REF_NAME}-linux-x64.tar.gz" bundle) ;;
            windows) (cd build/windows/x64/runner/Release && powershell -Command "Compress-Archive -Path * -DestinationPath \"$GITHUB_WORKSPACE/KwikChat-${GITHUB_REF_NAME}-windows-x64.zip\"") ;;
          esac

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KwikChat-${{ github.ref_name }}-android.apk
            KwikChat-${{ github.ref_name }}-windows-x64.zip
            KwikChat-${{ github.ref_name }}-linux-x64.tar.gz
            KwikChat-${{ github.ref_name }}-web.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            **KwikChat ${{ github.ref_name }}**

            | Platform | Download |
            |---|---|
            | Android | `KwikChat-${{ github.ref_name }}-android.apk` — sideload, allow "Install unknown apps" |
            | Windows | `KwikChat-${{ github.ref_name }}-windows-x64.zip` — unzip, run `kwikchat.exe` |
            | Linux | `KwikChat-${{ github.ref_name }}-linux-x64.tar.gz` — `tar -xzf`, run `./kwikchat` |
            | Web | `KwikChat-${{ github.ref_name }}-web.tar.gz`, or the hosted site |

            iOS needs a macOS build with your signing identity — see docs/SETUP.md.

      - name: Report build failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s build.log ]; then echo "no build.log — failed before the build step"; exit 0; fi
          { echo "Build failure: **${{ matrix.label }}** for \`$GITHUB_SHA\` (run $GITHUB_RUN_ID)"; echo; echo '```'; head -c 40000 build.log; echo '```'; } > body.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=ci-report" --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues" -F title="CI analyze report" -F body=@body.md -f "labels[]=ci-report" >/dev/null || true
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$existing/comments" -F body=@body.md >/dev/null || true
          fi

  deploy-web:
    name: Deploy web to Cloudflare Pages
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Build web
        run: |
          flutter create --project-name kwikchat --org ng.kwikchat --platforms=web .
          flutter pub get
          flutter build web --release --base-href=/ \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish to Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kwikchat
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
